<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-label="Peninsula Insider — PI">
  <!--
    Peninsula Insider — "PI"
    A single-path Carmen-Sandiego portrait silhouette.
    3/4 profile, face turned to viewer's right, hat brim shadowing the eyes.
    The outline traces clockwise from the top-back of the crown:
    crown → back brim → underside → back of head → neck → coat shoulder →
    bottom → right shoulder → right collar peak → V opening → chin → lips →
    nose → forehead → under-brim → front brim → crown right → close.
  -->
  <defs>
    <linearGradient id="pi-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#F7F2E8"/>
      <stop offset="55%" stop-color="#EDE3CD"/>
      <stop offset="100%" stop-color="#D6C7A8"/>
    </linearGradient>
    <linearGradient id="pi-fig" x1="0.3" y1="0" x2="0.7" y2="1">
      <stop offset="0%"  stop-color="#15130F"/>
      <stop offset="100%" stop-color="#2A2622"/>
    </linearGradient>
  </defs>

  <!-- Paper background -->
  <rect width="240" height="300" fill="url(#pi-bg)"/>

  <!-- Soft halo behind figure -->
  <ellipse cx="122" cy="155" rx="100" ry="125" fill="#1F1D1A" opacity="0.045"/>

  <!--
    SINGLE PORTRAIT SILHOUETTE — one continuous path.
    All curves are smooth. No overlapping primitives.
  -->
  <path
    fill="url(#pi-fig)"
    d="
      M 112 20
      Q 80 22 68 38
      Q 58 56 60 78
      L 60 82
      Q 40 80 22 86
      Q 6 92 4 102
      Q 4 112 14 116
      Q 30 120 48 118
      L 56 116
      Q 56 138 60 158
      Q 64 174 68 184
      L 56 200
      Q 38 210 32 230
      Q 28 248 28 268
      L 28 300
      L 212 300
      L 212 268
      Q 212 248 208 230
      Q 202 212 182 198
      L 174 192
      Q 196 184 200 168
      Q 202 158 198 150
      L 192 146
      Q 200 144 208 140
      Q 218 134 216 126
      L 210 122
      Q 220 116 222 110
      Q 224 104 220 100
      L 214 98
      Q 222 96 226 90
      Q 230 82 224 76
      Q 216 70 200 68
      L 192 68
      Q 188 50 182 38
      Q 172 24 148 20
      Q 130 18 112 20 Z
    "
  />

  <!--
    EYE GLINT — small sliver of light under the brim, in background tone.
    Positioned under the front-right of the brim at the eye line.
  -->
  <path
    d="M 168 102 Q 178 103 186 105 L 185 108 Q 178 107 168 105 Z"
    fill="#F7F2E8"
    opacity="0.92"
  />

  <!-- Subtle hat band — thin horizontal stripe just above the brim line -->
  <path
    d="M 64 76 Q 124 84 188 76 L 188 82 Q 124 90 64 82 Z"
    fill="#F7F2E8"
    opacity="0.10"
  />

  <!-- Wordmark -->
  <text
    x="120" y="290"
    text-anchor="middle"
    font-family="Cormorant Garamond, Baskerville, serif"
    font-size="11"
    font-style="italic"
    font-weight="600"
    letter-spacing="4"
    fill="#1F1D1A"
    opacity="0.55"
  >PENINSULA INSIDER</text>
</svg>
