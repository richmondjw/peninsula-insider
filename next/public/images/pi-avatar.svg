<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" role="img" aria-label="Peninsula Insider — PI">
  <!--
    Peninsula Insider — "PI"
    Modern coastal portrait. Wide-brim sun hat (terracotta crown,
    sage-and-terra brim), flowing hair on the right, profile in
    cream against a dusty-blue bay. Sun behind, coastline below.
  -->
  <defs>
    <clipPath id="pi-disc">
      <circle cx="120" cy="120" r="100"/>
    </clipPath>
  </defs>

  <rect width="240" height="240" fill="#F3EEE5"/>

  <g clip-path="url(#pi-disc)">

    <!-- Bay sky -->
    <rect width="240" height="240" fill="#6E89A8"/>

    <!-- Sun behind hat -->
    <circle cx="118" cy="62" r="22" fill="#D67148"/>
    <circle cx="118" cy="62" r="22" fill="none" stroke="#F3EEE5" stroke-width="2"/>

    <!--
      Layering order (back to front):
      1. back hair (peeks behind shoulder on right)
      2. body (cream silhouette of shoulders + dress)
      3. neck
      4. head (with profile bumps on right side)
      5. front hair tress
      6. hat crown
      7. hat brim back (sage)
      8. hat brim front (terra)
      9. coastline horizon arc (over the bottom of body)
    -->

    <!-- 1. Back hair behind right shoulder -->
    <path
      d="
        M 152 116
        Q 168 130 174 156
        Q 178 184 170 215
        L 192 222
        Q 204 192 200 158
        Q 196 130 178 110
        Z
      "
      fill="#C56848"
      stroke="#F3EEE5"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <!-- 2. Body — soft trapezoid of cream that fades into bottom of disc -->
    <path
      d="
        M 70 232
        Q 70 200 100 188
        L 144 188
        Q 174 200 174 232
        L 174 260
        L 70 260 Z
      "
      fill="#F3EEE5"
    />

    <!-- 3. Neck -->
    <path
      d="M 110 162 L 110 188 L 134 188 L 134 158 L 110 162 Z"
      fill="#F3EEE5"
    />

    <!--
      4. HEAD — egg-shaped, with prominent profile bumps on the right
      side: brow → bridge of nose → nose tip → upper lip → chin.
    -->
    <path
      d="
        M 100 110
        Q 96 92 116 88
        Q 130 86 142 90
        Q 150 94 152 102
        L 156 110
        Q 162 116 164 124
        Q 168 132 162 138
        L 160 142
        Q 162 150 156 154
        L 150 160
        Q 142 166 130 166
        Q 116 166 106 158
        Q 96 148 96 134
        Q 96 122 100 110 Z
      "
      fill="#F3EEE5"
    />

    <!-- 4b. Profile contour — single soft line tracing the face -->
    <path
      d="M 156 110 Q 162 118 162 128 Q 162 138 158 142 Q 158 150 152 156"
      stroke="#1F1D1A"
      stroke-width="1.1"
      fill="none"
      opacity="0.18"
      stroke-linecap="round"
    />

    <!-- 5. Front hair tress — single dramatic lock falling from under
         the brim, in front of the shoulder, on the right side. -->
    <path
      d="
        M 156 116
        Q 152 140 148 168
        Q 144 192 152 218
        L 168 220
        Q 172 192 170 162
        Q 168 138 162 116
        Z
      "
      fill="#C56848"
      stroke="#F3EEE5"
      stroke-width="2.2"
      stroke-linejoin="round"
    />

    <!-- Hair flow strands -->
    <path d="M 156 134 Q 154 162 158 198" stroke="#F3EEE5" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.55"/>
    <path d="M 164 144 Q 164 172 165 205" stroke="#F3EEE5" stroke-width="1.3" fill="none" stroke-linecap="round" opacity="0.4"/>

    <!--
      6. HAT CROWN — terracotta dome, sits on top of head only.
      Lower bound at y=82, leaving the face visible below.
    -->
    <path
      d="
        M 84 82
        Q 80 50 122 46
        Q 162 50 160 82
        Z
      "
      fill="#D67148"
      stroke="#F3EEE5"
      stroke-width="2.4"
      stroke-linejoin="round"
    />

    <!--
      7. HAT BRIM — back half (sage) and front half (terra).
      Stays HIGH (y=80-100) so the face below is clearly visible.
    -->
    <path
      d="
        M 14 90
        Q 56 78 122 78
        L 122 100
        Q 56 100 18 108
        Q 6 100 14 90 Z
      "
      fill="#8FA180"
      stroke="#F3EEE5"
      stroke-width="2.4"
      stroke-linejoin="round"
    />
    <path
      d="
        M 122 78
        Q 184 78 226 92
        Q 232 100 226 108
        Q 200 116 168 116
        Q 144 116 122 110
        L 122 78 Z
      "
      fill="#C56848"
      stroke="#F3EEE5"
      stroke-width="2.4"
      stroke-linejoin="round"
    />

    <!-- 8. Hat band -->
    <path
      d="M 90 84 Q 122 88 154 84"
      stroke="#F3EEE5"
      stroke-width="3"
      fill="none"
      stroke-linecap="round"
    />

    <!--
      9. COASTLINE — sits OVER the lower body to read as the
      figure standing at the waterline.
    -->
    <path
      d="M -20 208 Q 120 184 260 208"
      stroke="#C56848"
      stroke-width="2.6"
      fill="none"
    />

  </g>

  <!-- Disc outline -->
  <circle cx="120" cy="120" r="100" fill="none" stroke="#F3EEE5" stroke-width="2.5"/>
  <circle cx="120" cy="120" r="102.5" fill="none" stroke="#1F1D1A" stroke-width="0.6" opacity="0.18"/>
</svg>
