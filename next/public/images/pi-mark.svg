<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="Peninsula Insider — PI mark">
  <!--
    PI compact mark — for chat avatars, nav, small contexts.
    The hat-and-collar silhouette only. Reads clearly at 24px.
  -->
  <circle cx="32" cy="32" r="32" fill="#1F1D1A"/>

  <g fill="#F3EEE5">
    <!-- Hat brim -->
    <ellipse cx="32" cy="22" rx="20" ry="2.6"/>
    <!-- Hat crown — slightly low, akubra-ish -->
    <path d="M19 21 Q19 11 32 11 Q45 11 45 21 Z"/>
    <!-- Hat band cutout for definition -->
    <rect x="20" y="19.5" width="24" height="1.5" fill="#1F1D1A" opacity="0.55"/>
    <!-- Head/jaw -->
    <ellipse cx="32" cy="33" rx="6" ry="6.5"/>
    <!-- Coat / shoulders — collar popped -->
    <path d="M11 60 Q11 41 32 39 Q53 41 53 60 Z"/>
    <!-- Collar peaks -->
    <path d="M22 39 L29 36 L29 47 L25 43 Z" fill="#1F1D1A" opacity="0.4"/>
    <path d="M42 39 L35 36 L35 47 L39 43 Z" fill="#1F1D1A" opacity="0.4"/>
  </g>
</svg>
