name: Editorial quality check

# Runs the Peninsula Insider editorial quality audit.
#
# Two modes:
#   1. Weekly schedule (Sunday 20:00 UTC = Monday 6:00 AEST) — full corpus audit.
#      Produces a quality report at ops/reports/editorial/quality-YYYY-MM-DD.md.
#   2. Pull request — scoped to changed article/venue files. Warn-only on PRs
#      so a single phrase violation doesn't block a content deploy; errors
#      (em-dashes, banned phrases, stale venue refs) fail the PR check.
#
# The phrase blacklist and rules are maintained in:
#   ops/scripts/editorial-quality-check.py  (audit engine)
#   ops/scripts/editorial-phrase-audit.py   (fix runner)
#
# Related: docs/editorial/style-guide.md (the human-readable rule source)

on:
  schedule:
    # Sunday 20:00 UTC — Monday 06:00 AEST
    - cron: '0 20 * * 0'
  pull_request:
    branches:
      - main
    paths:
      - 'next/src/content/articles/**'
      - 'next/src/content/venues/**'
      - 'ops/scripts/editorial-quality-check.py'
      - 'ops/scripts/editorial-phrase-audit.py'
      - '.github/workflows/editorial-quality.yml'
  workflow_dispatch:
    inputs:
      fail_on_warnings:
        description: 'Treat warnings as errors (strict mode)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: editorial-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  editorial-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run editorial quality audit
        id: audit
        run: |
          set +e
          if [[ "${{ inputs.fail_on_warnings }}" == "true" ]]; then
            python ops/scripts/editorial-quality-check.py --fail-on-warnings
          else
            python ops/scripts/editorial-quality-check.py
          fi
          STATUS=$?
          set -e
          echo "exit_code=${STATUS}" >> "$GITHUB_OUTPUT"
          # Parse report for counts
          REPORT=$(ls ops/reports/editorial/quality-*.md 2>/dev/null | sort | tail -1)
          if [[ -n "$REPORT" ]]; then
            echo "report_path=${REPORT}" >> "$GITHUB_OUTPUT"
            ERRORS=$(grep -c '^\- \*\*\[' "$REPORT" 2>/dev/null || echo 0)
            echo "error_count=${ERRORS}" >> "$GITHUB_OUTPUT"
          fi
          exit ${STATUS}

      - name: Commit quality report (scheduled runs only)
        if: github.event_name == 'schedule' && steps.audit.outputs.report_path != ''
        run: |
          git config user.name  "peninsula-insider-bot"
          git config user.email "bot@peninsulainsider.com.au"
          git add ops/reports/editorial/
          git diff --cached --quiet || git commit -m "chore: weekly editorial quality report $(date +%Y-%m-%d)"
          git push

      - name: Step summary
        if: always()
        run: |
          EXIT="${{ steps.audit.outputs.exit_code }}"
          {
            echo "## Editorial quality audit"
            echo ""
            if [[ "$EXIT" == "0" ]]; then
              echo "✅ No blocking errors. See report for warnings."
            else
              echo "❌ Errors found. See \`ops/reports/editorial/\` for details."
            fi
            echo ""
            echo "**Run:** \`python ops/scripts/editorial-quality-check.py\`"
            echo "**Fix phrases:** \`python ops/scripts/editorial-phrase-audit.py --fix\`"
          } >> "$GITHUB_STEP_SUMMARY"
