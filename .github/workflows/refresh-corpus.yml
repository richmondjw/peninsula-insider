name: Refresh concierge corpus

# Reads the latest venue + article source content, chunks each entity
# deterministically, and idempotently upserts to Supabase. Only re-embeds
# chunks whose text actually changed (compared via SHA-256).
#
# Setup required (one-time, in repo Settings → Secrets and variables → Actions):
#   Variable:  SUPABASE_URL          = https://mvdtkgsfuhmkioygxgge.supabase.co
#   Secret:    SUPABASE_SERVICE_KEY  = (Supabase service_role key)
#   Secret:    OPENAI_API_KEY        = (your OpenAI key)

on:
  schedule:
    - cron: '0 19 * * *'          # 06:00 Australia/Melbourne (AEDT) daily
  push:
    branches: [main]
    paths:
      - 'next/src/content/venues/**'
      - 'next/src/content/articles/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Mode'
        required: false
        default: 'normal'
        type: choice
        options: [normal, dry, force]

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    # Skip our own auto-build commits (deploy.yml tags them with [skip ci])
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run corpus refresh
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          MODE_FLAGS=""
          case "${{ inputs.mode }}" in
            dry)   MODE_FLAGS="--dry"   ;;
            force) MODE_FLAGS="--force" ;;
          esac
          node scripts/refresh-corpus.mjs $MODE_FLAGS
