name: Content Foundry CI

on:
  pull_request:
    paths:
      - 'studio-peninsula-insider/**'
      - '.github/workflows/content-foundry-ci.yml'
  push:
    branches:
      - 'feature/content-foundry-*'
    paths:
      - 'studio-peninsula-insider/**'
      - '.github/workflows/content-foundry-ci.yml'

permissions:
  contents: read

# Real URL capture stays off in CI. The vertical slice is exercised entirely through
# in-process transport doubles; CI performs no outbound capture.
env:
  FOUNDRY_REAL_URLS_ENABLED: "0"

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: studio-peninsula-insider
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio-peninsula-insider/package-lock.json
      - run: npm ci
      - run: npm run check:capture-boundary
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --audit-level=moderate

  container-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: studio-peninsula-insider
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose up --build --wait
      - run: curl --fail --silent --show-error http://127.0.0.1:4310/api/health
      - run: curl --fail --silent --show-error http://127.0.0.1:4310/ | grep -F 'Peninsula Insider Workbench'
      - if: always()
        run: docker compose down
