name: Events editorial research

# Manual workflow for the event-card-research-writeup skill.
#
# Today: triggered manually via workflow_dispatch with an event slug. Runs
# the apply step against an existing research note checked into ops/reports/
# events/research/. Editor reviews the resulting PR.
#
# Tomorrow (deferred to v2): adds a scheduled cron + autonomous research
# step using the Anthropic API with web search. Same apply path, just with
# the research note generated by an LLM rather than hand-curated.
#
# Skill spec: .claude/skills/event-card-research-writeup/SKILL.md

on:
  workflow_dispatch:
    inputs:
      slug:
        description: 'Event slug (e.g. tall-poppy-melbourne-design-week-exhibition)'
        required: true
        type: string
      check_only:
        description: 'Validate only, do not write changes'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: events-editorial-research-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - name: Run apply script
        id: apply
        run: |
          set -e
          RESEARCH_PATH="ops/reports/events/research/${{ inputs.slug }}.md"
          if [ ! -f "$RESEARCH_PATH" ]; then
            echo "::error::Research note not found at $RESEARCH_PATH"
            echo "Create the research note first under ops/reports/events/research/"
            exit 1
          fi
          FLAGS="--slug ${{ inputs.slug }} --research $RESEARCH_PATH"
          if [ "${{ inputs.check_only }}" = "true" ]; then
            FLAGS="$FLAGS --check-only"
          fi
          python next/scripts/apply-event-editorial.py $FLAGS

      - name: Open PR if event JSON changed
        if: ${{ inputs.check_only != 'true' }}
        run: |
          set -e
          if [[ -z "$(git status --porcelain next/src/content/events/)" ]]; then
            echo "No changes to commit (editorial fields already match)."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          BRANCH="auto/event-research/${{ inputs.slug }}-$(date +%Y-%m-%d)"
          git checkout -b "$BRANCH"
          git add next/src/content/events/${{ inputs.slug }}.json
          git commit -m "feat(events): editorial copy for ${{ inputs.slug }}"
          git push -u origin "$BRANCH"
          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat(events): editorial copy for ${{ inputs.slug }}" \
            --body "Auto-generated editorial fields from research note at \`ops/reports/events/research/${{ inputs.slug }}.md\`. Editor review required before merge."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
