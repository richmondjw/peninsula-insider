name: Build and Deploy — Peninsula Insider

on:
  push:
    branches: [main]
    paths:
      - 'next/src/**'
      - 'next/public/**'
      - 'next/astro.config.mjs'
      - 'next/package.json'
      - '.github/workflows/build-and-deploy.yml'
  schedule:
    # Rebuild twice per Melbourne weekend day. UTC remains safely within the
    # weekend when DST shifts (08:00/14:00 AEST, 09:00/15:00 AEDT).
    - cron: '0 22 * * 5'
    - cron: '0 4 * * 6'
    - cron: '0 22 * * 6'
    - cron: '0 4 * * 0'
  workflow_dispatch:

# GITHUB_TOKEN must be able to push the built site to gh-pages.
permissions:
  contents: write
  issues: write

# Cancel any in-progress deploy on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: next/package-lock.json

      - name: Install dependencies
        run: |
          cd next
          npm ci --prefer-offline

      - name: CMS editable-coverage gate
        run: node next/scripts/check-editable-coverage.mjs

      - name: Content admission gate
        run: |
          cd next
          npm run test:content-admission
          npm run validate:content

      - name: Build
        run: |
          cd next
          npm run build:search
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUBLIC_CONCIERGE_API_URL: https://peninsula-insider-platform-api.vercel.app
          # Set to 'off' to remove the temporary client-side password gate
          # and launch the site publicly.
          PUBLIC_ACCESS_GATE: 'on'

      - name: Generate agent index (llms.txt)
        # Build the agent-discoverability layer from the freshly-built sitemap so
        # /llms.txt and /llms-full.txt ship in dist and can never drift from what
        # was actually published. See ops/scripts/generate-llms-txt.mjs.
        run: |
          node ops/scripts/generate-llms-txt.mjs \
            --sitemap next/dist/sitemap.xml \
            --out-dir next/dist

      - name: Prune internal surfaces from deploy output (T-006)
        # v5 hygiene (2026-07-11, T-006): the editorial admin surface
        # (next/src/pages/admin + public/admin/media-registry.json) must not
        # ship in the public static build. It remains available in local dev
        # and PI_ADMIN_HYBRID server builds. Reversible: delete this step.
        # NOTE: studio-peninsula-insider/ and ops/ never enter this deploy —
        # gh-pages publishes only next/dist. They exist at the repo root only
        # as leftovers of the retired build-live.sh root-deploy model.
        run: |
          rm -rf next/dist/admin
          rm -rf next/dist/dev
          echo "Pruned next/dist/admin and next/dist/dev from deploy output"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./next/dist
          publish_branch: gh-pages
          cname: peninsulainsider.com.au
          force_orphan: false
          commit_message: "deploy: ${{ github.sha }} — ${{ github.event.head_commit.message }}"

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Deploy failed: ${{ github.sha }}" \
            --body "Build and Deploy failed for [${{ github.sha }}](${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}).\n\nRun: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nCommit: ${{ github.event.head_commit.message }}" || echo "::error::Could not create deploy-failure issue"
