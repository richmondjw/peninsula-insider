name: Build and Deploy — Peninsula Insider

on:
  push:
    branches: [main]
    paths:
      - 'next/src/**'
      - 'next/public/**'
      - 'next/astro.config.mjs'
      - 'next/package.json'
      # The build's gate set lives in next/scripts and ops/scripts, and package.json
      # invokes it. Omitting them meant a change to a gate never exercised that gate:
      # d442813 fixed the SEO ratchet baseline and triggered no run at all, so the
      # fix sat unverified on main. A change to the thing that guards the build must
      # rebuild the build.
      #
      # ops/baselines/** is the whole directory rather than the one SEO file it
      # used to name: every ratchet ceiling now lives there, and changing any of
      # them changes what the build will accept. Ratcheting one down and seeing
      # no run at all is the same defect d442813 hit.
      - 'next/scripts/**'
      - 'next/tests/**'
      - 'ops/scripts/seo/**'
      - 'ops/event-intelligence/**'
      - 'ops/scripts/post-publish-verify.mjs'
      - 'ops/scripts/lib/publication-page-policy.mjs'
      - 'ops/scripts/generate-llms-txt.mjs'
      - 'ops/seo-automation/**'
      - 'ops/baselines/**'
      - '.github/workflows/build-and-deploy.yml'
  schedule:
    # The event feed and rolling weekend page are generated at build time.
    # Rebuild daily just after midnight in Melbourne so yesterday's
    # occurrences cannot remain published until the next editorial deploy.
    - cron: '10 14 * * *'
    # Rebuild twice per Melbourne weekend day. UTC remains safely within the
    # weekend when DST shifts (08:00/14:00 AEST, 09:00/15:00 AEDT).
    - cron: '0 22 * * 5'
    - cron: '0 4 * * 6'
    - cron: '0 22 * * 6'
    - cron: '0 4 * * 0'
    # Midweek rebuild so build-time-derived content (e.g. HomePlan.astro's
    # featured-plan rotation) doesn't sit stale for the ~5.75-day gap
    # between the Sunday weekend run and the next Friday one. 06:00 AEST/
    # AEDT-ish, safely mid-morning Melbourne either way.
    - cron: '0 20 * * 2'
  workflow_dispatch:

# GITHUB_TOKEN must be able to push the built site to gh-pages.
permissions:
  contents: write
  issues: write

# Cancel any in-progress deploy on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      TZ: Australia/Sydney
      AGENT_PREVIOUS_CATALOG: /tmp/pi-agent-previous.json

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: next/package-lock.json

      - name: Install dependencies
        run: |
          cd next
          npm ci --prefer-offline

      - name: CMS editable-coverage gate
        run: node next/scripts/check-editable-coverage.mjs

      - name: Content admission gate
        run: |
          cd next
          npm run test:content-admission
          npm run test:share-link
          npm run test:saves-store
          npm run test:season
          npm run test:nav
          npm run test:corrections
          npm run test:corrections-queue
          npm run test:partner-enquiry
          npm run test:agent-readiness
          node --test scripts/agent-formats.test.mjs scripts/agent-scorecard.test.mjs
          npm run test:event-safeguards
          npm run test:event-occurrence
          node --test ../ops/scripts/post-publish-verify.test.mjs
          python3 scripts/recompute-occurrence.py --dry-run --today 2026-10-12 > /tmp/pi-market-occurrence-check.txt
          if grep -F 'mornington-racecourse-market.json ->' /tmp/pi-market-occurrence-check.txt; then
            echo "::error::Confirmed-only market was advanced to an unverified date"
            exit 1
          fi
          npm run test:material-change
          npm run validate:content
          node scripts/assert-event-listing-quality.mjs mornington-racecourse-market

      - name: Retain previous public catalogue
        run: node next/scripts/prepare-agent-baseline.mjs --out /tmp/pi-agent-previous.json

      - name: Build
        run: |
          cd next
          build_day=$(TZ=Australia/Sydney date +%F)
          if npm run build:search; then
            build_ok=true
          else
            build_ok=false
          fi
          if [ "$build_day" != "$(TZ=Australia/Sydney date +%F)" ]; then
            echo "::warning::Build crossed Sydney midnight; rerunning once so dated feeds match the new day."
            npm run build:search
          elif [ "$build_ok" != true ]; then
            exit 1
          fi
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}
          PUBLIC_CONCIERGE_API_URL: https://peninsula-insider-platform-api.vercel.app
          # Site-wide Insider Note signup popup. Set to 'off' for rollback.
          PUBLIC_NEWSLETTER_POPUP: 'on'
          # Stamped onto every analytics event as pi_release, so a metric can be
          # attributed to the build that produced it (PI-024). Same value as
          # SOURCE_SHA below; PUBLIC_ so Astro exposes it to client scripts.
          PUBLIC_RELEASE_SHA: ${{ github.sha }}

      - name: Verify discovery and business journeys
        run: npm --prefix next run test:discovery-journeys

      - name: Verify itinerary planning and trip handoff
        run: npm --prefix next run test:planning-journeys

      - name: Generate agent index (llms.txt)
        # Build the agent-discoverability layer from the freshly-built sitemap so
        # /llms.txt and /llms-full.txt ship in dist and can never drift from what
        # was actually published. See ops/scripts/generate-llms-txt.mjs.
        run: |
          node ops/scripts/generate-llms-txt.mjs \
            --sitemap next/dist/sitemap.xml \
            --out-dir next/dist
          node next/scripts/generate-agent-formats.mjs --dist next/dist
          node next/scripts/audit-agent-welcome.mjs --dist next/dist --report ops/reports/seo/agent-welcome.json

      - name: Retain agent experience acceptance
        uses: actions/upload-artifact@v4
        with:
          name: agent-experience-${{ github.run_id }}
          path: ops/reports/seo/agent-welcome.json
          retention-days: 90

      - name: Write deployment provenance
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
        run: |
          node --input-type=module -e "import { writeFileSync } from 'node:fs'; writeFileSync('next/dist/deployment.json', JSON.stringify({ sourceSha: process.env.SOURCE_SHA, runId: process.env.BUILD_RUN_ID, generatedAt: new Date().toISOString() }, null, 2) + '\n')"

      - name: Write immutable release manifest
        env:
          SOURCE_SHA: ${{ github.sha }}
          BUILD_RUN_ID: ${{ github.run_id }}
          RELEASE_TRIGGER: ${{ github.event_name }}
          RELEASE_ACTOR: ${{ github.actor }}
        run: |
          cd next
          npm run test:release-contract
          npm run release:manifest

      - name: Prune internal surfaces from deploy output (T-006)
        # v5 hygiene (2026-07-11, T-006): the editorial admin surface
        # (next/src/pages/admin + public/admin/media-registry.json) must not
        # ship in the public static build. It remains available in local dev
        # and PI_ADMIN_HYBRID server builds. Reversible: delete this step.
        # NOTE: studio-peninsula-insider/ and ops/ never enter this deploy —
        # gh-pages publishes only next/dist. They exist at the repo root only
        # as leftovers of the retired build-live.sh root-deploy model.
        run: |
          rm -rf next/dist/admin
          rm -rf next/dist/dev
          echo "Pruned next/dist/admin and next/dist/dev from deploy output"

      - name: SEO artefact integrity gate
        # Asserts the BUILT site, not source declarations. The April 2026 bulk
        # sitemapExclude shipped noindex,nofollow to ~127 published pages and
        # survived every source-level lint for 100 days, so this gate reads what
        # next/dist actually emits: sitemap URLs that are noindex, redirects or
        # not self-canonical; permanent migrations pairing noindex with a foreign
        # canonical; redirect/canonical loops and multi-hop chains; malformed
        # internal hrefs. Runs before deploy so a regression never reaches Google.
        run: |
          node ops/scripts/seo/build-url-ledger.mjs \
            --dist next/dist \
            --out ops/reports/seo/ledger \
            --assert

      - name: Install pinned SEO tools
        working-directory: ops/seo-automation
        run: |
          npm ci --no-audit --no-fund
          npm run setup
          npm test

      - name: SiteOne and Lighthouse pre-deploy gate
        working-directory: ops/seo-automation
        run: npm run audit -- --target=local --profile=ci

      - name: Retain SEO gate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          path: ops/seo-automation/.runs/
          include-hidden-files: true
          retention-days: 90
          if-no-files-found: warn

      - name: Verify dated feeds at publish boundary
        working-directory: next
        run: npm run audit:agent-readiness

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./next/dist
          publish_branch: gh-pages
          cname: peninsulainsider.com.au
          force_orphan: false
          commit_message: "deploy: ${{ github.sha }} — ${{ github.event.head_commit.message }}"

      - name: Verify Mornington Market on the public site
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          for attempt in {1..75}; do
            if node ops/scripts/post-publish-verify.mjs \
              --kind=event \
              --event-quality \
              --expect-illustration \
              --expect-source-host=www.mornpen.vic.gov.au \
              "--expect-sha=$SOURCE_SHA" \
              "--report=$RUNNER_TEMP/mornington-market-live.md" \
              https://peninsulainsider.com.au/whats-on/mornington-racecourse-market/; then
              exit 0
            fi
            echo "Public release not yet verified (attempt $attempt/75)"
            sleep 20
          done
          exit 1

      - name: Retain Mornington Market live verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mornington-market-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/mornington-market-live.md
          retention-days: 90
          if-no-files-found: warn

      - name: Verify weekend page on the public site
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          for attempt in {1..75}; do
            if node ops/scripts/post-publish-verify.mjs \
              --kind=page \
              "--expect-sha=$SOURCE_SHA" \
              "--report=$RUNNER_TEMP/weekend-page-live.md" \
              https://peninsulainsider.com.au/whats-on/this-weekend/; then
              exit 0
            fi
            echo "Weekend page not yet verified on public release (attempt $attempt/75)"
            sleep 20
          done
          exit 1

      - name: Retain weekend page live verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weekend-page-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/weekend-page-live.md
          retention-days: 90
          if-no-files-found: warn

      - name: Verify Dominion event detail while the one-off show is current
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          if [ "$(date -u +%s)" -ge "$(date -u -d '2026-10-09T10:00:00Z' +%s)" ]; then
            printf '# Dominion live verification\nSkipped: one-off event has ended.\n' > "$RUNNER_TEMP/dominion-event-live.md"
            exit 0
          fi
          for attempt in {1..75}; do
            if node ops/scripts/post-publish-verify.mjs \
              --kind=event \
              --event-quality \
              --expect-illustration \
              --expect-source-host=events.humanitix.com \
              "--expect-sha=$SOURCE_SHA" \
              "--report=$RUNNER_TEMP/dominion-event-live.md" \
              https://peninsulainsider.com.au/whats-on/dominion-wrestling-big-group-hug-mornington-2026/; then
              exit 0
            fi
            echo "Dominion detail not yet verified on public release (attempt $attempt/75)"
            sleep 20
          done
          exit 1

      - name: Retain Dominion event live verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dominion-event-live-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/dominion-event-live.md
          retention-days: 90
          if-no-files-found: warn

      - name: Alert on failure (non-silent)
        # Red main must surface immediately. Uses the repo's existing alert path
        # (engine/alert.py — structured file under ops/alerts/ plus a deduplicated
        # `pi-alert` GitHub issue), the same channel the daily/weekly/monthly
        # content workflows use, so deploy failures land where operators already
        # look instead of opening a fresh untriaged issue on every red run.
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PI_REPO_ROOT: ${{ github.workspace }}
          # Interpolated via env, never inline: a quote or backtick in a commit
          # message must not break the one step whose job is to raise the alarm.
          COMMIT_URL: ${{ github.server_url }}/${{ github.repository }}/commit/${{ github.sha }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          BODY=$(printf '%s\n' \
            "Build, deploy, or live acceptance failed; inspect the failed step before claiming this release is live." \
            "" \
            "Commit: ${COMMIT_URL}" \
            "Message: ${COMMIT_MESSAGE}" \
            "Run: ${RUN_URL}" \
            "" \
            "If the failing step is the content admission gate, a placeholder stub or" \
            "schema-invalid content file reached main. Find it with:" \
            "    cd next && npm run validate:content" \
            "then fix or remove the offending file.")
          python3 engine/alert.py \
            --title "Deploy failed on main (run #${{ github.run_number }})" \
            --body "$BODY" \
            --dedup deploy-main-failure --severity fatal
