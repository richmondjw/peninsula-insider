name: Build and Deploy — Peninsula Insider

on:
  push:
    branches: [main]
    paths:
      - 'next/src/**'
      - 'next/public/**'
      - 'next/astro.config.mjs'
      - 'next/package.json'
  workflow_dispatch:

# GITHUB_TOKEN must be able to push the built site to gh-pages.
permissions:
  contents: write

# Cancel any in-progress deploy on new push
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: next/package-lock.json

      - name: Install dependencies
        run: |
          cd next
          npm ci --prefer-offline

      - name: CMS editable-coverage gate
        run: node next/scripts/check-editable-coverage.mjs

      - name: Build
        run: |
          cd next
          npm run build:search
        env:
          PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          PUBLIC_CONCIERGE_API_URL: https://peninsula-insider-platform-api.vercel.app
          # Set to 'off' to remove the temporary client-side password gate
          # and launch the site publicly.
          PUBLIC_ACCESS_GATE: 'on'

      - name: Generate agent index (llms.txt)
        # Build the agent-discoverability layer from the freshly-built sitemap so
        # /llms.txt and /llms-full.txt ship in dist and can never drift from what
        # was actually published. See ops/scripts/generate-llms-txt.mjs.
        run: |
          node ops/scripts/generate-llms-txt.mjs \
            --sitemap next/dist/sitemap.xml \
            --out-dir next/dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./next/dist
          publish_branch: gh-pages
          cname: peninsulainsider.com.au
          force_orphan: false
          commit_message: "deploy: ${{ github.sha }} — ${{ github.event.head_commit.message }}"

      - name: Notify on failure
        if: failure()
        run: |
          echo "Build failed for commit ${{ github.sha }}"
          echo "Commit message: ${{ github.event.head_commit.message }}"
          # In production: write failure to .claude/newsroom/runs/deploy-failure.json
          # or ping webhook
