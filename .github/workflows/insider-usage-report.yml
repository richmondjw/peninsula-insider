name: Insider usage report

# Reads concierge_queries from Supabase, computes daily usage / latency /
# cost / top-intent analytics, writes a JSON + Markdown report under
# reports/insider-usage/, and posts a Telegram digest to the Peninsula
# Insider group.
#
# Setup required (one-time, in repo Settings → Secrets and variables → Actions):
#   Variable:  SUPABASE_URL
#   Secret:    SUPABASE_SERVICE_KEY
#   Secret:    TELEGRAM_BOT_TOKEN   (optional; report runs without it)
#   Variable:  TELEGRAM_CHAT_ID     (optional)
#   Variable:  TELEGRAM_TOPIC_ID    (optional, for forum-style groups)
#
# Schedule: 22:00 UTC = 08:00 Melbourne AEST / 09:00 AEDT — morning slot, so
# the report covers the previous 24h and lands as James's day starts.

on:
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:
    inputs:
      window_hours:
        description: 'Lookback window in hours (default 24)'
        required: false
        default: '24'
      dry:
        description: 'Dry run — compute, do not write or post'
        required: false
        default: false
        type: boolean

permissions:
  contents: write   # commit the daily report under reports/insider-usage/

concurrency:
  group: insider-usage-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate report
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ vars.TELEGRAM_CHAT_ID }}
          TELEGRAM_TOPIC_ID: ${{ vars.TELEGRAM_TOPIC_ID }}
        run: |
          WINDOW="${{ inputs.window_hours }}"
          WINDOW="${WINDOW:-24}"
          FLAGS="--window=$WINDOW"
          if [ "${{ inputs.dry }}" = "true" ]; then
            FLAGS="$FLAGS --dry"
          fi
          node ops/scripts/insider-usage-report.mjs $FLAGS

      - name: Commit daily report
        if: success() && inputs.dry != 'true'
        run: |
          set -euxo pipefail
          if [ ! -d reports/insider-usage ]; then
            echo "No report directory; nothing to commit."
            exit 0
          fi
          git config user.name  "insider-usage-bot"
          git config user.email "insider-usage@peninsulainsider.com.au"
          git add reports/insider-usage/
          if git diff --staged --quiet; then
            echo "No new report to commit."
            exit 0
          fi
          DATE=$(date -u +%Y-%m-%d)
          git commit -m "ops(insider): daily usage report $DATE [skip ci]"
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed report on attempt $attempt"
              exit 0
            fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done
          echo "::error::Failed to push report after 3 attempts"
          exit 1
