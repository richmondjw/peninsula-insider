name: Sanity dataset backup

on:
  schedule:
    # Daily at 17:00 UTC (~ 03:00 Melbourne, off-peak).
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Sanity CLI globally
        run: npm install -g @sanity/cli@latest

      - name: Export dataset
        env:
          SANITY_AUTH_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: |
          DATE=$(date -u +%Y-%m-%d)
          mkdir -p ops/backups
          # Use --project to avoid needing the local Studio's sanity.cli.ts
          # config (which depends on the Studio's node_modules being installed).
          sanity dataset export production "ops/backups/sanity-$DATE.tar.gz" \
            --project-id a062b30n \
            --no-drafts
          ls -lh "ops/backups/sanity-$DATE.tar.gz"

      - name: Upload backup as artifact
        uses: actions/upload-artifact@v4
        with:
          # Export tarball is ~180 MB, exceeding GitHub's 100 MB per-file
          # limit in the repo. Store as a workflow artifact instead, with
          # 90-day retention to match the previous prune policy.
          name: sanity-backup-${{ github.run_id }}
          path: ops/backups/sanity-*.tar.gz
          retention-days: 90
          if-no-files-found: error
