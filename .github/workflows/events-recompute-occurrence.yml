name: Events recompute occurrence

# Daily cron job 1 from the events registry design.
#
# For each recurring event (weekly, monthly, annual), recomputes the
# `nextOccurrence` field. Idempotent: rerunning produces the same
# result, so the workflow only commits when something actually changed.
#
# Schedule: 17:00 UTC daily = 03:00 Melbourne AEST / 04:00 AEDT.

on:
  schedule:
    - cron: '0 17 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: events-recompute-occurrence
  cancel-in-progress: false

jobs:
  recompute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run recompute script
        run: python next/scripts/recompute-occurrence.py

      - name: Append publication ledger entry if any
        run: |
          if [[ -z "$(git status --porcelain next/src/content/events/)" ]]; then
            echo "No nextOccurrence changes."
            exit 0
          fi

          CHANGED_COUNT=$(git diff --name-only -- next/src/content/events/ | wc -l | tr -d ' ')
          export LEDGER_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          export LEDGER_RUN_ID="${GITHUB_RUN_ID}"
          export LEDGER_SUMMARY="Refreshed nextOccurrence for ${CHANGED_COUNT} recurring event file(s)."
          export LEDGER_NOTES="Workflow-level source mutation only; live site publish occurs in deploy workflow."

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          entry = {
              "timestamp": os.environ["LEDGER_TIMESTAMP"],
              "job_name": "events-recompute-occurrence",
              "agent_or_owner": "github-actions[bot]",
              "content_type": "event-registry-maintenance",
              "canonical_url_or_path": "next/src/content/events/",
              "change_summary": os.environ["LEDGER_SUMMARY"],
              "risk_tier": "low",
              "approval_mode": "system-approved",
              "approved_by": None,
              "publish_result": "published",
              "verification_result": "not-required",
              "rollback_reference": None,
              "run_id": os.environ["LEDGER_RUN_ID"],
              "notes": os.environ["LEDGER_NOTES"],
          }
          path = Path('/tmp/pi-ledger-entry.json')
          path.write_text(json.dumps(entry, indent=2) + '\n', encoding='utf-8')
          print(path)
          PY

          python3 ops/scripts/publication-ledger.py append --entry-file /tmp/pi-ledger-entry.json

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [[ -n "$(git status --porcelain next/src/content/events/ ops/publication-ledger/)" ]]; then
            git add next/src/content/events/ ops/publication-ledger/
            git commit -m "ops(events): refresh nextOccurrence for recurring events [skip ci]"
            git push origin main
          else
            echo "No nextOccurrence changes."
          fi
