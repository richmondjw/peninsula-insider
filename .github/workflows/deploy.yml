name: Build & deploy site to GitHub Pages

# Auto-rebuilds the live site at peninsulainsider.com.au whenever source
# changes land on `main`. Replaces the manual `bash build-live.sh` flow.
#
# Setup required (one-time):
#   1. GitHub → repo Settings → Secrets and variables → Actions
#   2. Add the following Variables (or Secrets — Variables are fine for
#      these since none of them are secret in the cryptographic sense;
#      the publishable Supabase key is RLS-gated and ships in the static
#      bundle anyway):
#        PUBLIC_CONCIERGE_API_URL  = https://peninsula-insider-platform-api.vercel.app
#        PUBLIC_SUPABASE_URL       = https://tjjhpvslpysfklwpqmgz.supabase.co
#        PUBLIC_SUPABASE_ANON_KEY  = sb_publishable_... (or legacy eyJ... anon key)
#
# After that, every push to main rebuilds and publishes the generated site to
# the gh-pages branch. main stays source-only, so content pushes cannot drag a
# stale generated root snapshot across the repo.
#
# If PUBLIC_SUPABASE_ANON_KEY is unset, next/src/lib/auth.ts gracefully
# degrades to localStorage-only — saves and itineraries still work on
# the device, but cross-device sync, signed-in award voting, and the
# /submit/ form's database insert all silently no-op. So this isn't
# strictly required for the site to *build*, but it is required for the
# Phase 3+4 cloud features to actually work in production.

on:
  # Manual only while main/source is being reconciled with the recovered live
  # Pages baseline. This prevents a small content push from rebuilding the
  # whole site and overwriting gh-pages with stale or preview output.
  workflow_dispatch:

permissions:
  contents: write           # needed to publish the build artifact branch

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    # Skip if the commit message says [skip ci] or is our own auto-build
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Capture run start time (run-log)
        id: runlog-start
        run: |
          STARTED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "started_at=${STARTED_AT}" >> "$GITHUB_OUTPUT"
          echo "Run started at ${STARTED_AT}"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: next/package-lock.json

      - name: Install dependencies
        working-directory: next
        run: npm ci --no-audit --no-fund

      - name: Deploy preflight (Stage B item 2)
        # Stage B item 2 — deploy-path dependency + preflight checks.
        # Currently runs in --skip-env mode (env presence checks happen in
        # the actual build step); fails closed only if a build/source/leak
        # check actually fails. Warnings are surfaced but non-blocking.
        run: |
          node ops/scripts/deploy-preflight.mjs --skip-env

      - name: Enforce CMS editor conventions (CMS Integrity Plan, Phase 3)
        # Fails the build if any *Card.astro or PiSaveActions consumer is
        # missing the entity-scoped editor attrs. Stops the filename-keyed
        # auto-detect bug from reappearing under a new card type.
        run: |
          if [ -f next/scripts/check-editable-coverage.mjs ]; then
            node next/scripts/check-editable-coverage.mjs
          elif [ -f scripts/check-editable-coverage.mjs ]; then
            node scripts/check-editable-coverage.mjs
          else
            echo "::warning::check-editable-coverage.mjs is not present in this checkout (tried next/scripts/ and scripts/); skipping CMS editor convention check."
          fi

      - name: Refresh CMS content registry (CMS Integrity Plan, Phase 1)
        # Populates pi.content_registry with the current set of valid
        # (entity_type, entity_slug) pairs. The CMS write triggers refuse
        # writes that don't match a row here, so this must run before any
        # editor uses the inline editor.
        #
        # `continue-on-error: true` is intentional and temporary. The
        # SUPABASE_SERVICE_KEY repo secret currently authenticates to an
        # older Supabase project, not to `tjjhpvslpysfklwpqmgz` (the
        # active CMS database) — so the upsert 401s. The site already
        # has 516 entities seeded directly (2026-05-11) so existing
        # editor flows still work; new content slugs just won't reach
        # the registry until the secret is rotated.
        #
        # TO FIX: update the `SUPABASE_SERVICE_KEY` repo secret to be the
        # service-role key for project tjjhpvslpysfklwpqmgz (Dashboard →
        # Settings → API → service_role), then remove `continue-on-error`
        # below to restore strict integrity.
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node next/scripts/refresh-content-registry.mjs

      - name: Refresh entity index (Phase B projector)
        # Projects every Astro content collection through the canonical
        # facet taxonomy (next/src/taxonomy/facet-taxonomy.yaml) and upserts
        # pi.entity_index + pi.entity_attributes. Read by pi.search() at
        # runtime to power typeahead, planner, concierge, and the iOS app.
        #
        # Same continue-on-error stance as refresh-content-registry above:
        # the deploy proceeds even if the projector fails (e.g. transient
        # Supabase auth). The runtime falls back to Pagefind in that case.
        continue-on-error: true
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          node next/scripts/refresh-entity-index.mjs --apply --prune

      - name: Embed entity index (Phase C)
        # Populates pi.entity_index.embedding for rows whose content_hash
        # has drifted since the last run. Uses text-embedding-3-small
        # (same model as the concierge corpus, no second pipeline).
        # Skipped silently when OPENAI_API_KEY is not configured —
        # pi.search() still works with lexical + facet, just no semantic.
        continue-on-error: true
        env:
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          if [ -z "${OPENAI_API_KEY:-}" ]; then
            echo "::notice::OPENAI_API_KEY not configured; skipping embedding refresh."
            exit 0
          fi
          node next/scripts/embed-entity-index.mjs --apply

      - name: Build Astro site
        working-directory: next
        env:
          PUBLIC_CONCIERGE_API_URL: ${{ vars.PUBLIC_CONCIERGE_API_URL || secrets.PUBLIC_CONCIERGE_API_URL }}
          # Phase 3+ — Supabase auth + cross-device sync. Anon (publishable)
          # key is RLS-gated; safe to embed in the static bundle. URL is
          # also non-sensitive (it's the project's public hostname). When
          # either is unset, lib/auth.ts gracefully no-ops to localStorage.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY }}
          # Phase 6 WS6A — Stripe Checkout for Pass tiers. Publishable
          # key + price ids are non-sensitive (RLS-equivalent — Stripe
          # validates everything server-side). Until set, /pass/ falls
          # back to the waitlist email-capture flow.
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_STRIPE_PUBLISHABLE_KEY || secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_PRICE_INSIDER_MONTHLY: ${{ vars.PUBLIC_STRIPE_PRICE_INSIDER_MONTHLY || secrets.PUBLIC_STRIPE_PRICE_INSIDER_MONTHLY }}
          PUBLIC_STRIPE_PRICE_INSIDER_ANNUAL:  ${{ vars.PUBLIC_STRIPE_PRICE_INSIDER_ANNUAL  || secrets.PUBLIC_STRIPE_PRICE_INSIDER_ANNUAL }}
          PUBLIC_STRIPE_PRICE_FOUNDERS:        ${{ vars.PUBLIC_STRIPE_PRICE_FOUNDERS        || secrets.PUBLIC_STRIPE_PRICE_FOUNDERS }}
        run: |
          echo "Building with API URL: ${PUBLIC_CONCIERGE_API_URL:-(unset)}"
          echo "Supabase URL configured:    $([ -n "$PUBLIC_SUPABASE_URL" ] && echo yes || echo no)"
          echo "Supabase anon key configured: $([ -n "$PUBLIC_SUPABASE_ANON_KEY" ] && echo yes || echo no)"
          echo "Stripe publishable key:     $([ -n "$PUBLIC_STRIPE_PUBLISHABLE_KEY" ] && echo yes || echo no)"
          echo "Stripe Insider monthly:     $([ -n "$PUBLIC_STRIPE_PRICE_INSIDER_MONTHLY" ] && echo yes || echo no)"
          echo "Stripe Insider annual:      $([ -n "$PUBLIC_STRIPE_PRICE_INSIDER_ANNUAL" ] && echo yes || echo no)"
          echo "Stripe Founders:            $([ -n "$PUBLIC_STRIPE_PRICE_FOUNDERS" ] && echo yes || echo no)"
          npm run build:search

      - name: Prepare GitHub Pages artifact
        run: |
          set -euxo pipefail

          rm -rf /tmp/pi-pages
          mkdir -p /tmp/pi-pages
          cp -R next/dist/. /tmp/pi-pages/

          # Stable fallback stylesheet that some legacy pages reference
          mkdir -p /tmp/pi-pages/assets
          cp next/src/styles/global.css /tmp/pi-pages/assets/styles.css

          # GitHub Pages root metadata
          touch /tmp/pi-pages/.nojekyll
          if [ -f CNAME ]; then
            cp CNAME /tmp/pi-pages/CNAME
          fi

          # Sanity check
          if [ ! -f /tmp/pi-pages/assets/styles.css ]; then
            echo "::error::stable fallback stylesheet missing at ./assets/styles.css"
            exit 1
          fi

          page_count=$(find /tmp/pi-pages -name '*.html' -print | wc -l)
          echo "Built $page_count pages"

      - name: Publish artifact to gh-pages
        env:
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euxo pipefail
          TRIGGER_MSG=$(printf '%s\n' "$HEAD_COMMIT_MSG" | head -1 | tr -d '"' | tr -d '`' | tr -d '$')
          cd /tmp/pi-pages
          git init
          git checkout -b gh-pages
          git config user.name  "peninsula-insider-deploy[bot]"
          git config user.email "deploy@peninsulainsider.com.au"
          git add -A
          git commit -F - <<EOF
          build: deploy site from ${GITHUB_SHA::7} [skip ci]

          Trigger: ${TRIGGER_MSG:-manual workflow dispatch}
          EOF
          git push --force "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

      - name: Post-publish verification (Stage B item 1)
        # Stage B item 1 — verify the deploy externally before the run-log
        # records success. This is the gate that prevents "deploy succeeded"
        # being mistaken for "page rendered". Allow a brief warm-up for the
        # GitHub Pages CDN to pick up the new commit before probing.
        id: post-publish-verify
        if: success()
        env:
          PI_LIVE_URL: ${{ vars.PI_LIVE_URL || 'https://peninsulainsider.com.au/' }}
        run: |
          echo "Sleeping 60s to let GitHub Pages propagate…"
          sleep 60
          if node ops/scripts/post-publish-verify.mjs "${PI_LIVE_URL}"; then
            echo "verification=passed" >> "$GITHUB_OUTPUT"
          else
            echo "verification=failed" >> "$GITHUB_OUTPUT"
            # Don't fail the workflow on first roll-out; surface as warning.
            # Flip to `exit 1` once the gate has been observed across a few
            # successful deploys (tracked in EXC-2026-05-10-007).
            echo "::warning::post-publish verification reported issues for ${PI_LIVE_URL}"
          fi

      - name: Append run-log entry (local only)
        # Keep run metadata visible in workflow logs without committing
        # generated run-log churn back to main. main is source-only now.
        if: always()
        env:
          STARTED_AT: ${{ steps.runlog-start.outputs.started_at }}
          VERIFICATION: ${{ steps.post-publish-verify.outputs.verification }}
        run: |
          set -e
          ENDED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")

          if [[ "${VERIFICATION}" == "failed" ]]; then
            STATUS="partial"
            ERROR_SUMMARY="post-publish verification flagged issues — see workflow logs"
            ALERT_FLAGS=( --alert-sent --alert-channel github-issue )
          elif [[ "${{ job.status }}" == "success" ]]; then
            STATUS="success"
            ERROR_SUMMARY=""
            ALERT_FLAGS=()
          else
            STATUS="failure"
            ERROR_SUMMARY="job status: ${{ job.status }}"
            ALERT_FLAGS=( --alert-sent --alert-channel github-issue )
          fi

          ERROR_FLAGS=()
          if [[ -n "${ERROR_SUMMARY}" ]]; then
            ERROR_FLAGS=( --error-summary "${ERROR_SUMMARY}" )
          fi

          node ops/scripts/run-log.mjs new \
            --job-name deploy-site-to-github-pages \
            --job-source github-actions \
            --run-id "${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --started-at "${STARTED_AT}" \
            --ended-at "${ENDED_AT}" \
            --status "${STATUS}" \
            --mutation mutating-live \
            --surfaces "/" \
            "${ALERT_FLAGS[@]}" \
            "${ERROR_FLAGS[@]}" \
            --notes "automated GitHub Actions deploy; verification=${VERIFICATION:-not-run}" \
            --append

          git diff -- ops/run-log/ || true
