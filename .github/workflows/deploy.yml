name: Build & deploy site to GitHub Pages

# Auto-rebuilds the live site at peninsulainsider.com.au whenever source
# changes land on `main`. Replaces the manual `bash build-live.sh` flow.
#
# Setup required (one-time):
#   1. GitHub → repo Settings → Secrets and variables → Actions
#   2. Add the following Variables (or Secrets — Variables are fine for
#      these since none of them are secret in the cryptographic sense;
#      the publishable Supabase key is RLS-gated and ships in the static
#      bundle anyway):
#        PUBLIC_CONCIERGE_API_URL  = https://peninsula-insider-platform-api.vercel.app
#        PUBLIC_SUPABASE_URL       = https://tjjhpvslpysfklwpqmgz.supabase.co
#        PUBLIC_SUPABASE_ANON_KEY  = sb_publishable_... (or legacy eyJ... anon key)
#
# After that, every push to main rebuilds + commits the dist back to main.
# GitHub Pages serves from main/root so the deploy is "automatic".
#
# If PUBLIC_SUPABASE_ANON_KEY is unset, next/src/lib/auth.ts gracefully
# degrades to localStorage-only — saves and itineraries still work on
# the device, but cross-device sync, signed-in award voting, and the
# /submit/ form's database insert all silently no-op. So this isn't
# strictly required for the site to *build*, but it is required for the
# Phase 3+4 cloud features to actually work in production.

on:
  push:
    branches: [main]
    # Skip our own auto-build commits (we tag them with [skip ci])
  workflow_dispatch:        # allow manual trigger from the Actions tab

permissions:
  contents: write           # needed to push the build commit back to main

concurrency:
  group: pages-deploy
  cancel-in-progress: false  # let in-flight builds finish to avoid half-deployed state

jobs:
  build-and-deploy:
    # Skip if the commit message says [skip ci] or is our own auto-build
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: next/package-lock.json

      - name: Install dependencies
        working-directory: next
        run: npm ci --no-audit --no-fund

      - name: Build Astro site
        working-directory: next
        env:
          PUBLIC_CONCIERGE_API_URL: ${{ vars.PUBLIC_CONCIERGE_API_URL || secrets.PUBLIC_CONCIERGE_API_URL }}
          # Phase 3+ — Supabase auth + cross-device sync. Anon (publishable)
          # key is RLS-gated; safe to embed in the static bundle. URL is
          # also non-sensitive (it's the project's public hostname). When
          # either is unset, lib/auth.ts gracefully no-ops to localStorage.
          PUBLIC_SUPABASE_URL: ${{ vars.PUBLIC_SUPABASE_URL || secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ vars.PUBLIC_SUPABASE_ANON_KEY || secrets.PUBLIC_SUPABASE_ANON_KEY }}
          # Phase 6 WS6A — Stripe Checkout for Pass tiers. Publishable
          # key + price ids are non-sensitive (RLS-equivalent — Stripe
          # validates everything server-side). Until set, /pass/ falls
          # back to the waitlist email-capture flow.
          PUBLIC_STRIPE_PUBLISHABLE_KEY: ${{ vars.PUBLIC_STRIPE_PUBLISHABLE_KEY || secrets.PUBLIC_STRIPE_PUBLISHABLE_KEY }}
          PUBLIC_STRIPE_PRICE_INSIDER_MONTHLY: ${{ vars.PUBLIC_STRIPE_PRICE_INSIDER_MONTHLY || secrets.PUBLIC_STRIPE_PRICE_INSIDER_MONTHLY }}
          PUBLIC_STRIPE_PRICE_INSIDER_ANNUAL:  ${{ vars.PUBLIC_STRIPE_PRICE_INSIDER_ANNUAL  || secrets.PUBLIC_STRIPE_PRICE_INSIDER_ANNUAL }}
          PUBLIC_STRIPE_PRICE_FOUNDERS:        ${{ vars.PUBLIC_STRIPE_PRICE_FOUNDERS        || secrets.PUBLIC_STRIPE_PRICE_FOUNDERS }}
        run: |
          echo "Building with API URL: ${PUBLIC_CONCIERGE_API_URL:-(unset)}"
          echo "Supabase URL configured:    $([ -n "$PUBLIC_SUPABASE_URL" ] && echo yes || echo no)"
          echo "Supabase anon key configured: $([ -n "$PUBLIC_SUPABASE_ANON_KEY" ] && echo yes || echo no)"
          echo "Stripe publishable key:     $([ -n "$PUBLIC_STRIPE_PUBLISHABLE_KEY" ] && echo yes || echo no)"
          echo "Stripe Insider monthly:     $([ -n "$PUBLIC_STRIPE_PRICE_INSIDER_MONTHLY" ] && echo yes || echo no)"
          echo "Stripe Insider annual:      $([ -n "$PUBLIC_STRIPE_PRICE_INSIDER_ANNUAL" ] && echo yes || echo no)"
          echo "Stripe Founders:            $([ -n "$PUBLIC_STRIPE_PRICE_FOUNDERS" ] && echo yes || echo no)"
          npm run build:search

      - name: Sync dist to repo root (mirrors build-live.sh)
        run: |
          set -euxo pipefail

          # Wipe everything at root EXCEPT the things build-live.sh preserves.
          # Note: .github is preserved here too so the workflow can re-run.
          find . -mindepth 1 -maxdepth 1 \
            ! -name '.git' \
            ! -name '.github' \
            ! -name '.gitignore' \
            ! -name '.nojekyll' \
            ! -name 'CNAME' \
            ! -name 'next' \
            ! -name 'docs' \
            ! -name 'ops' \
            ! -name 'reports' \
            ! -name 'build-v2.sh' \
            ! -name 'build-live.sh' \
            ! -name 'CHANGELOG.md' \
            ! -name 'HANDOVER-CLAUDE.md' \
            ! -name 'BRAND-PI.md' \
            ! -name '.approvals' \
            -exec rm -rf {} +

          # Copy fresh build to root
          cp -r next/dist/. .

          # Stable fallback stylesheet that some legacy pages reference
          mkdir -p assets
          cp next/src/styles/global.css assets/styles.css

          # Sanity check
          if [ ! -f assets/styles.css ]; then
            echo "::error::stable fallback stylesheet missing at ./assets/styles.css"
            exit 1
          fi

          page_count=$(find . -path './.git' -prune -o -path './next' -prune -o -name '*.html' -print | wc -l)
          echo "Built $page_count pages"

      - name: Commit and push deploy
        env:
          # Pass the trigger commit message via env var rather than
          # ${{ github.event.head_commit.message }} inline. The template
          # substitution dumps the raw message into the generated shell
          # script, so any backtick / quote / parens in the message
          # produces a shell parse error and the deploy fails before push.
          # See: failed runs #159, #160, #163 (commit messages that
          # referenced `pi.submissions` etc. in backticks).
          HEAD_COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          git config user.name  "peninsula-insider-deploy[bot]"
          git config user.email "deploy@peninsulainsider.com.au"

          git add -A

          if git diff --staged --quiet; then
            echo "No build changes to commit"
            exit 0
          fi

          # First line of the trigger message, stripped of quotes + backticks.
          # Reads HEAD_COMMIT_MSG from the env block above; the value never
          # touches the shell parser as source so any character in the
          # message is safe.
          TRIGGER_MSG=$(printf '%s\n' "$HEAD_COMMIT_MSG" | head -1 | tr -d '"' | tr -d '`' | tr -d '$')
          git commit -F - <<EOF
          build: deploy site (auto) [skip ci]

          Built from ${GITHUB_SHA::7}: ${TRIGGER_MSG}
          EOF

          # Use a retry loop in case the branch moved while we were building
          for attempt in 1 2 3; do
            if git push origin main; then
              echo "Pushed deploy on attempt $attempt"
              exit 0
            fi
            echo "Push failed, refetching and retrying ($attempt/3)..."
            git fetch origin main
            git rebase origin/main || { git rebase --abort; exit 1; }
          done

          echo "::error::Failed to push after 3 attempts"
          exit 1
