name: Entity index drift check

# Phase B of the data architecture plan
# (vault: 07-projects/peninsula-insider/data-architecture-assessment-2026-05-16.md).
#
# Runs the entity-index projector in dry-run on every PR that touches
# content, the taxonomy, or the projector itself. Surfaces:
#   - row count changes (entities + attributes)
#   - facet coverage shifts
#   - YAML-level errors in the projector
#
# Non-blocking until the projector promotes to deploy-time integration.
# This is the "did the change you're shipping match the editorial intent"
# observability surface.

on:
  pull_request:
    branches:
      - main
    paths:
      - 'next/src/content/**'
      - 'next/src/taxonomy/**'
      - 'next/scripts/refresh-entity-index.mjs'
      - 'ops/migrations/2026-05-16-pi-entity-attributes-and-index.sql'
      - '.github/workflows/entity-index-drift.yml'
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: entity-index-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: next/package-lock.json

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Dry-run projector
        id: dryrun
        run: |
          set +e
          OUTPUT=$(node scripts/refresh-entity-index.mjs 2>&1)
          STATUS=$?
          set -e
          printf '%s\n' "$OUTPUT"
          ENTITIES=$(printf '%s\n' "$OUTPUT" | grep "entities projected:" | awk '{print $NF}')
          ATTRS=$(printf '%s\n' "$OUTPUT" | grep "attribute rows:" | awk '{print $NF}')
          echo "entities=${ENTITIES}" >> "$GITHUB_OUTPUT"
          echo "attributes=${ATTRS}" >> "$GITHUB_OUTPUT"
          echo "exit=${STATUS}" >> "$GITHUB_OUTPUT"
          exit ${STATUS}

      - name: Coverage report
        id: report
        if: success()
        run: |
          node scripts/refresh-entity-index.mjs --report > coverage.md
          {
            echo "## Entity index drift"
            echo ""
            echo "- Entities projected: ${{ steps.dryrun.outputs.entities }}"
            echo "- Attribute rows:     ${{ steps.dryrun.outputs.attributes }}"
            echo ""
            echo "<details><summary>Coverage table</summary>"
            echo ""
            cat coverage.md
            echo ""
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
