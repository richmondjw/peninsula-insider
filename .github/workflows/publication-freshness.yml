name: Publication Freshness — Peninsula Insider

# A scheduler success only says a process exited. This independent probe proves
# that today's dated source record exists and that GitHub Pages is serving it.
on:
  schedule:
    # 08:30 AEST / 09:30 AEDT: after the 06:00 daily writer and deploy window.
    # Acts as a backstop; the primary trigger is workflow_run below.
    - cron: '30 22 * * *'
  workflow_run:
    # Fire automatically after the build-and-deploy workflow completes so the
    # live page is actually deployed before we verify it. Triggering after the
    # daily content engine was too early: content was committed but GitHub Pages
    # had not yet received the deploy, causing a spurious 404 on the live check.
    workflows: ["Build and Deploy — Peninsula Insider"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: publication-freshness
  cancel-in-progress: false

jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify current source and live Insider Picks page
        env:
          TZ: Australia/Sydney
        # Retry up to 3 times with a 5-minute sleep between attempts.
        # Exit code 2 = source record missing/stale (fatal, no retry).
        # Exit code 1 = live page not yet deployed (transient, retriable).
        # Exit code 0 = fully passing.
        run: |
          EXPECTED_DATE="$(date +%F)"
          MAX_ATTEMPTS=3
          ATTEMPT=0
          EXIT_CODE=0
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "Freshness check attempt ${ATTEMPT}/${MAX_ATTEMPTS} for ${EXPECTED_DATE}"
            python engine/publication_freshness.py \
              --expected-date "$EXPECTED_DATE" \
              --article "next/src/content/articles/insider-picks-${EXPECTED_DATE}.md" \
              --url "https://peninsulainsider.com.au/journal/insider-picks-${EXPECTED_DATE}/"
            EXIT_CODE=$?
            if [ $EXIT_CODE -eq 0 ]; then
              echo "Freshness check passed on attempt ${ATTEMPT}."
              break
            elif [ $EXIT_CODE -eq 2 ]; then
              echo "Source record failure (exit 2) — not retriable."
              break
            else
              # Exit code 1: live-page transient failure — wait and retry.
              if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
                echo "Live-page transient failure (exit 1) — sleeping 5 minutes before retry..."
                sleep 300
              else
                echo "Live-page failure persists after ${MAX_ATTEMPTS} attempts."
              fi
            fi
          done
          exit $EXIT_CODE

      - name: Alert on stale or unavailable publication
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          PI_REPO_ROOT: ${{ github.workspace }}
        run: |
          python engine/alert.py \
            --title "Insider Picks freshness gate failed (run #${{ github.run_number }})" \
            --body "Today's source record or the deployed Insider Picks page did not pass freshness verification. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --dedup publication-freshness --severity fatal
