name: Events daily rebuild

# Cron job 3 from the events registry design (this-weekend / expiry refresh).
#
# Triggers a fresh deploy every day so time-sensitive event lists
# (homepage "this weekend" strip, /whats-on/, /whats-on/by-mood/this-weekend/,
# the section hub event strips) reflect the current date correctly.
#
# Critical: the `isUpcoming` filter in whats-on/index.astro runs at build time
# against `new Date()`. Without daily rebuilds, events that passed their
# endDate after the last deploy stay visible until the next code push.
#
# Doesn't change any files; just dispatches the existing build-and-deploy
# workflow with an empty commit so the regenerated pages capture the
# updated "upcoming" window.
#
# Schedule: 19:30 UTC daily = 05:30 Melbourne AEST / 06:30 AEDT.
# (runs 30 min after the archive-expired job at 17:30 UTC so freshly
# archived events are excluded before the rebuild fires)

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: events-weekly-rebuild
  cancel-in-progress: false

jobs:
  trigger-rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Empty commit to trigger deploy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "ops(events): daily rebuild for event expiry refresh [skip ci]"
          git push origin main
