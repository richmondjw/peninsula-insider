<!DOCTYPE html><html lang="en-AU"> <head><meta charset="utf-8"><title>Redirecting…</title><!-- Do not hide html/body here. Component CSS is collected from the whole
         module graph, so a redirect branch once hid ordinary venue pages.
         The synchronous script below redirects before the empty body paints. --><!-- JS redirect fires synchronously - browser navigates before first paint --><script>(function(){const to = "/eat/distilleries/";

      (function () {
        var target = to;
        if (window.location.search) {
          target += (target.indexOf('?') === -1 ? '?' : '&') + window.location.search.slice(1);
        }
        if (window.location.hash) {
          target += window.location.hash;
        }
        window.location.replace(target);
      })();
    })();</script><!-- No-JS fallback --><meta http-equiv="refresh" content="0;url=/eat/distilleries/"><link rel="canonical" href="https://peninsulainsider.com.au/eat/distilleries/"></head> <body></body></html>
